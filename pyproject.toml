[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "vixspx"
version = "0.1.0"
description = "Does the VIX predict S&P 500 returns? Predictive regressions, event study, and VIX x momentum interaction."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "statsmodels",
    "matplotlib",
    "yfinance",
]

[project.optional-dependencies]
notebook = ["jupyter", "ipykernel"]

[tool.setuptools]
packages = ["vixspx"]
